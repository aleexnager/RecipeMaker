<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="description" content="Gestiona tu despensa, tus utensilios y descubre qué recetas puedes cocinar con lo que tienes." />
    <title>RecipeMaker</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeos (FOUC) al cargar.
      ;(function () {
        try {
          var stored = localStorage.getItem('recipemaker-theme')
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
